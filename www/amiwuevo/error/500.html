<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>500 - Internal Server Error</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background-color: black;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .content {
        z-index: 1;
        padding: 20px;
        transform: translateY(-8vh);
    }

    h1 {
        font-size: 72px;
        margin: 0;
    }

    h2 {
        margin-top: 10px;
    }

    p {
        margin-top: 10px;
    }

    button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: white;
        color: black;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #cccccc;
    }

    .bottom-image {
        position: absolute;
        bottom: 0;
        width: 100%;
        z-index: 0;
        overflow: hidden;
    }

    .bottom-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
</style>
</head>

<body>

<div class="content">
    <h1>500</h1>
    <h2>El servidor... que ha pasado con el servidor...</h2>
    <p>Se ha producido un error interno en el Reino</p>
    <p>Corre por tu vida... no te quedes aquí...</p>

    <button onclick="location.href='/'">
        Volver al inicio
    </button>
</div>

<div class="bottom-image">
    <img src="/error/500.png" alt="Error 500 image">
</div>

</body>
</html>
