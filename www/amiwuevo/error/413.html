<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>413 Payload Too Large</title>
</head>
<body>
    <div class="container">
        <h1>413</h1>
        <h2>Payload Too Large</h2>
        <p>Your request exceeds the maximum allowed size on this server.</p>
        <p>Please reduce the size of your upload or request and try again.</p>
        <div class="hint">
            <p>If you believe this is an error, contact the server administrator.</p>
        </div>
    </div>
</body>
</html>
