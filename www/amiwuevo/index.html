<!DOCTYPE html>

	<head>
		<title class="title">AMIWUEVO</title>
		<link rel="stylesheet" type="text/css" href="styles.css">
	</head>
	<body>
		<!--main image, occupies most of the screen-->
		<div class="main-div">
			<div class="title">
				<p id="display-name">Cargando...</p>

				<input type="text" id="nameInput" placeholder="Enter name" maxlength="30">
				<button onclick="saveName()">Guardar</button>
			</div>
			<div class="content">
				<div class="content-left">
					<div class="tamagotchi-container">
  						<div class="egg-base"></div>
  						<img src="/images/gifs/base_idle.gif" class="egg" alt="Egg">
					</div>
				</div>

				<div class="button-div">
					<button class="trigger-eat-btn"><img src="/images/icons/bowl-food-solid.svg" alt="give food"></button> <!--onclick wil call a cgi-->
					<button class="change-fit-btn"><img src="/images/icons/shirt-solid.svg" alt="change outfit"></button>
					<button class="change-bg-btn"><img src="/images/icons/image-solid.svg" alt="change decor"></button>
					<button onclick="/cgi-bin/"><img src="/images/icons/xmark-solid.svg" alt="kill amiwuevo"></button>
				</div>
			</div>

			<div class="status-bar"></div>
		</div>

		<script>
		// Cargar nombre al iniciar
		window.onload = function() 
		{
			fetch('/api/name')
			.then(response => {
				if (!response.ok) throw new Error();
				return response.text();
			})
			.then(name => {
				if (name)
					document.getElementById("display-name").textContent = name;
				else
					document.getElementById("display-name").textContent = "amiwuevo name";
			})
			.catch(() => {
				document.getElementById("display-name").textContent = "amiwuevo name";
			});
		};

		function saveName() 
		{
			const name = document.getElementById("nameInput").value;

			if (!name) {
				alert("Introduce un nombre");
				return;
			}

			fetch('/api/name', {
				method: 'POST',
				body: name
			})
			.then(response => {
				if (response.ok) {
					document.getElementById("display-name").textContent = name;
					alert("Nombre guardado");
				} else {
					alert("Error al guardar");
				}
			})
			.catch(() => alert("Error de red"));
		}

		//Change background button
		document.addEventListener('DOMContentLoaded', function() 
		{
			const btn = document.querySelector('.change-fit-btn');
			if (!btn) 
				return;
			btn.addEventListener('click', function(e) 
			{
				e.preventDefault();
				//Execute chang_outfit.py so it changes the database
				fetch('/cgi-bin/change_outfit.py').then(response => response.text()).then(data => 
				{
					console.log('CGI change_outfit.py output:', data);
					//Execute get_outfit.py so it changes the .css to the file in database

					fetch('/cgi-bin/get_outfit.py').then(response => response.text()).then(bg => 
					{
    					const imgPath = bg.split('\n').map(line => line.trim()).filter(line => line);
    					const outfit = imgPath[imgPath.length - 1];
    					document.querySelector('.egg').src = `images/gifs/${outfit}_idle.gif`;
					});
				});
			});
		});

		//Trigger eating animation with button
		document.addEventListener('DOMContentLoaded', function()
		{
			const btn = document.querySelector('.trigger-eat-btn');
			if (!btn)
			{
				console.log("Button ot found");
				return;
			}
			console.log("before event");
			btn.addEventListener('click', function(e)
			{
				console.log("after event");
				e.preventDefault();
				fetch('/cgi-bin/get_outfit.py').then(response => response.text()).then(outfit =>
				{
					outfit = outfit.trim();
					console.log('CGI change_outfit.py output:', outfit);
					const container = document.querySelector('.egg');
					container.src = `images/gifs/${outfit}_eat.gif`;
					setTimeout(() => 
					{
						container.src = `images/gifs/${outfit}_idle.gif`;
					}, 1200);
				});
			});
		});
    </script>
	</body>
</html>
