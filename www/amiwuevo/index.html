<!DOCTYPE html>
	<head>
		<title class="title">AMIWUEVO</title>
		<link rel="stylesheet" type="text/css" href="styles.css">
		<meta charset="utf-8">
	</head>
	<body>
		<!--main image, occupies most of the screen-->
		<div class="main-div">
			<dialog class="modal" id="dialogNameInput">
				<h2>Otorgale una identidad a tu AmiWevo</h2>
				<input type="text" id="nameInput" placeholder="Enter name" maxlength="30">
				<button onclick="saveName()">Guardar</button>
			</dialog>
			<script>
				const dialog = document.getElementById("dialogNameInput")
				dialog.showModal()
			</script>

			<div class="title">
				<p id="display-name">Cargando...</p>
			</div>
			<div class="content">
				<div class="content-left">
					<div class="tamagotchi-container">
  						<div class="egg-base"></div>
  						<img src="/images/gifs/base_idle.gif" class="egg" alt="Egg">
					</div>
				</div>

				<div class="button-div">
					<button class="trigger-eat-btn"><img src="/images/icons/bowl-food-solid.svg" alt="give food"></button> <!--onclick wil call a cgi-->
					<button class="change-fit-btn"><img src="/images/icons/shirt-solid.svg" alt="change outfit"></button>
					<button class="change-bg-btn"><img src="/images/icons/image-solid.svg" alt="change decor"></button>
					<button onclick="/cgi-bin/"><img src="/images/icons/xmark-solid.svg" alt="kill amiwuevo"></button>
				</div>
			</div>

			<div class="status-bar"></div>
			<div class="text">
				<p id="dialogue">"Hola. Si cierras esta pestaña, moriré"</p>
			</div>
			<div class="button-div-bottom">
					<button onclick= "readFile()"><img src="/images/icons/text.svg" alt="Talk to amiwevo"></button> <!--onclick wil call a cgi-->
			</div>
		</div>

		<script>
		// Cargar nombre al iniciar
		window.onload = function() 
		{
			fetch('/api/name')
			.then(response => {
				if (!response.ok) throw new Error();
				return response.text();
			})
			.then(name => {
				if (name)
					document.getElementById("display-name").textContent = name;
				else
					document.getElementById("display-name").textContent = "amiwuevo name";
			})
			.catch(() => {
				document.getElementById("display-name").textContent = "amiwuevo name";
			});

			fetch('/cgi-bin/get_outfit.py').then(response => response.text()).then(bg => 
			{
    			const imgPath = bg.split('\n').map(line => line.trim()).filter(line => line);
    			const outfit = imgPath[imgPath.length - 1];
    			document.querySelector('.egg').src = `images/gifs/${outfit}_idle.gif`;
			});
		};

// 20260307 SAVE NAME
function saveName()
{
	const name = document.getElementById("nameInput").value;

	if (!name)
	{
		alert("Introduce un nombre");
		return;
	}

			fetch('/api/name', {
				method: 'POST',
				body: name
			})
			.then(response => {
				if (response.ok) {
					document.getElementById("display-name").textContent = name;
					alert("Nombre guardado");
				} else {
					alert("Error al guardar");
				}
			})
			.catch(() => alert("Error de red"));
			dialog.close()
		}

// 20260311 CHANGE BACKGROUND (CUSTOM UPLOAD)
document.addEventListener('DOMContentLoaded', function()
{
	const btn = document.querySelector('.decor-bg-btn');
	const fileInput = document.getElementById("bgFileInput");
	const content = document.querySelector('.content');

	if (!btn || !fileInput || !content)
		return;

	loadBackground();

	btn.addEventListener("click", function()
	{
		fetch("/api/background")
		.then(r => r.text())
		.then(path => {

			// si es fondo por defecto → subir imagen
			if (path.includes("images/backgrounds/bg_01.png"))
			{
				fileInput.click();
			}
			// si hay imagen subida → borrar
			else
			{
				fetch("/api/background", { method: "DELETE" })
				.then(res => {

					if (!res.ok)
						return;

					loadBackground();
         });
			}
		  });
    });

	fileInput.addEventListener("change", function()
	{
		const file = fileInput.files[0];
		if (!file)
			return;

		fetch("/api/background", {
			method: "POST",
			body: file
		})
		.then(res => {

			if (!res.ok)
			{
				alert("Imagen no válida");
				return;
			}

			loadBackground();
		});
	});
});

 document.addEventListener('DOMContentLoaded', function()
			const btn = document.querySelector('.change-fit-btn');
			if (!btn) 
				return;
			btn.addEventListener('click', function(e) 
			{
				e.preventDefault();
				//Execute chang_outfit.py so it changes the database
				fetch('/cgi-bin/change_outfit.py').then(response => response.text()).then(data => 
				{
					console.log('CGI change_outfit.py output:', data);
					//Execute get_outfit.py so it changes the .css to the file in database

					fetch('/cgi-bin/get_outfit.py').then(response => response.text()).then(bg => 
					{
    					const imgPath = bg.split('\n').map(line => line.trim()).filter(line => line);
    					const outfit = imgPath[imgPath.length - 1];
    					document.querySelector('.egg').src = `images/gifs/${outfit}_idle.gif`;
					});
        });
			}
		});

//20260311 CARGAR BACKGROUND (AL INICIO Y DESPUÉS DE SUBIR/ELIMINAR)
function loadBackground()
{
	const content = document.querySelector('.content');

	fetch("/api/background")
	.then(r => r.text())
	.then(bg => {

		if (!bg)
			return;

		content.style.backgroundImage = "url('" + bg + "?v=" + Date.now() + "')";
	});
}

		//Trigger eating animation with button
		document.addEventListener('DOMContentLoaded', function()
		{
			const btn = document.querySelector('.trigger-eat-btn');
			if (!btn)
			{
				console.log("Button ot found");
				return;
			}
			btn.addEventListener('click', function(e)
			{
				e.preventDefault();
				fetch('/cgi-bin/get_outfit.py').then(response => response.text()).then(outfit =>
				{
					outfit = outfit.trim();
					console.log('CGI change_outfit.py output:', outfit);
					const container = document.querySelector('.egg');
					container.src = `images/gifs/${outfit}_eat.gif`;
					setTimeout(() => 
					{
						container.src = `images/gifs/${outfit}_idle.gif`;
					}, 1200);
				});
			});
		});
    
    //Dialogue
		function readFile() {
			fetch('/api/dialogue')
			.then(response => {
				if (!response.ok) throw new Error();
				return response.text();
			})
			.then(dialogue => {
				if (dialogue)
					document.getElementById("dialogue").textContent = dialogue;
				else
					document.getElementById("dialogue").textContent = "Lore Ipsum";
				document.getElementById("tamagotchi-image").src = 'images/gifs/base_talk.gif';
				setTimeout(() =>
				{
					document.getElementById("tamagotchi-image").src = 'images/gifs/base_idle.gif';
			}, 2000);
			})
			.catch(() => {
				document.getElementById("dialogue").textContent = "Failed text";
			});
		};
    </script>
	</body>
</html>
