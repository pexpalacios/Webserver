<!DOCTYPE html>

<head>
	<title class="title">AMIWUEVO</title>
	<link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>

	<div class="main-div">

		<div class="title">
			<p id="display-name">Cargando...</p>

			<input type="text" id="nameInput" placeholder="Enter name" maxlength="30">
			<button onclick="saveName()">Guardar</button>

			<input type="file" id="fileInput" style="display:none" accept="image/png">
			<button id="bgButton" class="change-bg-btn">BG</button>

			<input type="file" id="bgFileInput" accept="image/png,image/jpeg,image/gif" style="display:none">
		</div>

		<div class="content">
			<div class="content-left">
				<div class="tamagotchi-container">
					<div class="egg-base"></div>
					<img src="/images/egg_face.gif" class="egg-face" alt="Egg Face">
				</div>
			</div>

			<div class="button-div">
				<button onclick="/cgi-bin/">
					<img src="/images/icons/bowl-food-solid.svg" alt="give food">
				</button>

				<button onclick="/cgi-bin/">
					<img src="/images/icons/shirt-solid.svg" alt="change outfit">
				</button>

				<button class="decor-bg-btn">
					<img src="/images/icons/image-solid.svg" alt="change decor">
				</button>

				<button onclick="/cgi-bin/">
					<img src="/images/icons/xmark-solid.svg" alt="kill amiwuevo">
				</button>
			</div>
		</div>

		<div class="status-bar"></div>

	</div>

<script>

// 20260307 LOAD INITIAL DATA
window.onload = function()
{
	// Load name
	fetch('/api/name')
	.then(response => {
		if (!response.ok) throw new Error();
		return response.text();
	})
	.then(name => {
		if (name)
			document.getElementById("display-name").textContent = name;
		else
			document.getElementById("display-name").textContent = "amiwuevo name";
	})
	.catch(() => {
		document.getElementById("display-name").textContent = "amiwuevo name";
	});

	// Load decor background (CGI system)
	fetch('/cgi-bin/get_bg.py')
	.then(response => response.text())
	.then(bg => {
		document.querySelector('.content').style.backgroundImage = `url('${bg}')`;
	});

	// Check if uploaded background exists
	checkUploadedBackground();
};


// 20260307 SAVE NAME
function saveName()
{
	const name = document.getElementById("nameInput").value;

	if (!name)
	{
		alert("Introduce un nombre");
		return;
	}

	fetch('/api/name', {
		method: 'POST',
		body: name
	})
	.then(response => {
		if (response.ok)
		{
			document.getElementById("display-name").textContent = name;
			alert("Nombre guardado");
		}
		else
			alert("Error al guardar");
	})
	.catch(() => alert("Error de red"));
}


// 20260307 CHANGE BACKGROUND (EXISTING CGI)
document.addEventListener('DOMContentLoaded', function()
{
	const btn = document.querySelector('.decor-bg-btn');

	if (!btn)
		return;

	btn.addEventListener('click', function(e)
	{
		e.preventDefault();

		fetch('/cgi-bin/change_bg.py')
		.then(response => response.text())
		.then(data => {

			console.log('CGI output:', data);

			fetch('/cgi-bin/get_bg.py')
			.then(response => response.text())
			.then(bg => {

				const lines = bg.split('\n')
					.map(line => line.trim())
					.filter(line => line);

				const imagePath = lines[lines.length - 1];

				document.querySelector('.content').style.backgroundImage =
					`url('${imagePath}')`;
			});
		});
	});
});


// 20260309 Terto: UPLOAD / DELETE BACKGROUND
document.addEventListener('DOMContentLoaded', function()
{
	const btn = document.getElementById("bgButton");
	const fileInput = document.getElementById("fileInput");

	function setUploadMode()
	{
		btn.textContent = "BG";
	}

	function setDeleteMode()
	{
		btn.textContent = "X";
	}

	// Delete uploaded background
	btn.addEventListener("click", function()
	{
		if (btn.textContent === "BG") // CHANGED
		{
			fileInput.click();
		}
		else
		{
			fetch("/api/upload_background", {
				method: "DELETE"
			})
			.then(res => {

				if (!res.ok)
					return;

				alert("Background eliminado correctamente");

				setUploadMode();

				// reload decor background
				fetch('/cgi-bin/get_bg.py')
				.then(r => r.text())
				.then(bg => {

					const lines = bg.split('\n')
						.map(line => line.trim())
						.filter(line => line);

					const imagePath = lines[lines.length - 1];

					document.querySelector('.content').style.backgroundImage =
						`url('${imagePath}')`;
				});
			});
		}
	});

	// Upload new background
	fileInput.addEventListener("change", function()
	{
		const file = fileInput.files[0];

		if (!file)
			return;

		fetch("/api/upload_background", {
			method: "POST",
			body: file
		})
		.then(res => {

			if (!res.ok)
			{
				alert("Esa imagen no es válida");
				return;
			}

			console.log("Background uploaded");

			fetch("/api/upload_background")
			.then(r => r.text())
			.then(bg => {

				document.querySelector('.content').style.backgroundImage =
					"url('" + bg + "?t=" + Date.now() + "')";

				setDeleteMode();
			});
		});
	});
});


// 20260309 Terto: Check if uploaded background exists
function checkUploadedBackground()
{
	const btn = document.getElementById("bgButton");

	if (!btn)
		return;

	fetch("/api/upload_background")
	.then(r => {

		if (r.status === 204)
		{
			setUploadMode(); // NEW → asegurar modo BG
			return null;
		}

		return r.text();
	})
	.then(bg => {

		if (!bg)
			return;

		document.querySelector('.content').style.backgroundImage =
			"url('" + bg + "?t=" + Date.now() + "')";

		setDeleteMode();
	})
	.catch(() => {
		setUploadMode(); // recomendable si falla la request
	});
}

</script>
</body>
</html>
