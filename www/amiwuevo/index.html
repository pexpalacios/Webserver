<!DOCTYPE html>
<html>
	<head>
		<title>AMIWUEVO</title>
		<link rel="stylesheet" type="text/css" href="styles.css">
	</head>

	<body>
		<div class="main-div">
			<div class="title">
				<p id="display-name">Cargando...</p>

				<input type="text" id="nameInput" placeholder="Enter name" maxlength="30">
				<button onclick="saveName()">Guardar</button>
			</div>

			<div class="content">
				<div class="content-left">
					<div class="tamagotchi-container">
						<div class="egg-base"></div>
						<img src="/images/face.gif" class="egg-face" alt="Egg Face">
					</div>
				</div>

				<div class="button-div">
					<button>
						<img src="/images/icons/bowl-food-solid.svg" alt="give food">
					</button>
					<button>
						<img src="/images/icons/shirt-solid.svg" alt="change outfit">
					</button>
					<button>
						<img src="/images/icons/image-solid.svg" alt="change decor">
					</button>
					<button>
						<img src="/images/icons/xmark-solid.svg" alt="kill amiwuevo">
					</button>
				</div>
			</div>

			<div class="status-bar"></div>
		</div>

		<script>
		// Cargar nombre al iniciar
		window.onload = function() {
			fetch('/api/name')
			.then(response => {
				if (!response.ok) throw new Error();
				return response.text();
			})
			.then(name => {
				if (name)
					document.getElementById("display-name").textContent = name;
				else
					document.getElementById("display-name").textContent = "amiwuevo name";
			})
			.catch(() => {
				document.getElementById("display-name").textContent = "amiwuevo name";
			});
		};

		function saveName() {
			const name = document.getElementById("nameInput").value;

			if (!name) {
				alert("Introduce un nombre");
				return;
			}

			fetch('/api/name', {
				method: 'POST',
				body: name
			})
			.then(response => {
				if (response.ok) {
					document.getElementById("display-name").textContent = name;
					alert("Nombre guardado");
				} else {
					alert("Error al guardar");
				}
			})
			.catch(() => alert("Error de red"));
		}
		</script>
	</body>
</html>
