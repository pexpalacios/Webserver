<!DOCTYPE html>
	<head>
		<title class="title">AMIWUEVO</title>
		<link rel="stylesheet" type="text/css" href="styles.css">
	</head>
	<body>
		<!--main image, occupies most of the screen-->
		<div class="main-div">
			<div class="title"><p>amiwuevo name</p>
			</div>
			<div class="content">
				<div class="content-left">
					<div class="tamagotchi-container">
  						<div class="egg-base"></div>
  						<img src="/images/egg_face.gif" class="egg-face" alt="Egg Face">
					</div>
				</div>
			<!--buttons, one of top of each other, they are divs cause they need styles, at the outost right of the screen-->
				<div class="button-div">
					<button onclick="/cgi-bin/"><img src="/images/icons/bowl-food-solid.svg" alt="give food"></button> <!--onclick wil call a cgi-->
					<button onclick="/cgi-bin/"><img src="/images/icons/shirt-solid.svg" alt="change outfit"></button>
					<button class="change-bg-btn"><img src="/images/icons/image-solid.svg" alt="change decor"></button>
					<button onclick="/cgi-bin/"><img src="/images/icons/xmark-solid.svg" alt="kill amiwuevo"></button>
				</div>
			</div>
			<!--this is teh hope bar, it will change based on interaction, so I'm no sure which kind of elemnet it is yet-->
			<div class="status-bar"></div>
		</div>
		<script>
document.addEventListener('DOMContentLoaded', function() 
{
	console.log("HI");
	const decorBtn = document.querySelector('.change-bg-btn');
	if (!decorBtn) 
	{
		console.log("Button not found!");
		return;
	}
	console.log("Button found!");

	decorBtn.addEventListener('click', function(e) 
	{
		e.preventDefault();
		const contentDiv = document.querySelector('.content');
		
		let bgUrl = getComputedStyle(contentDiv).backgroundImage;
		let match = bgUrl.match(/url\\((['\"]?)(.*?)\\1\\)/);
		bgUrl = match ? match[2] : 'images/backgrounds/bg_01.png';
		const currentBg = bgUrl || 'images/backgrounds/bg_01.png';

		console.log("FUCK");

		fetch(`/cgi-bin/change_bg.py?current=${encodeURIComponent(currentBg)}`)
			.then(response => response.json())
			.then(data => {
				contentDiv.style.backgroundImage = `url('${data.next_bg}')`;
			});
	});
});
</script>
	</body>
</html>
