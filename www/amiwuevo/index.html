<!DOCTYPE html>
	<head>
		<title class="title">AMIWUEVO</title>
		<link rel="stylesheet" type="text/css" href="styles.css">
		<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
		<meta charset="utf-8">
	</head>
	<body>
		<script src="script.js"></script>
		<!-- Empty div to give margin -->
		<div class="left-content">
			<div class="music-credits">
				<a href="https://www.youtube.com/watch?v=D5L36JDKxR0"></a>
				<div class="left-side">
					<p class="song">A Lonely Cherry Tree 🌸</p>
					<p class="author">Pix</p>
				</div>
				<div class="right-side">
					<img src="/images/icons/compact-disc-solid-full.svg">
				</div>
			</div>
		</div>
		<!-- main content div -->
		<div class="center-content">
			<!-- Start up modal for name input -->
			<dialog class="modal" id="dialogNameInput">
				<h2>Otorgale una identidad a tu Amiwuevo</h2>
				<input type="text" id="nameInput" placeholder="Enter name" maxlength="30">
				<button onclick="saveName()">Guardar</button>
			</dialog>
			<script>
				const dialog = document.getElementById("dialogNameInput")
				dialog.showModal()
			</script>

			<!-- Sound inputs -->
			<audio id="bg-music" loop>
				<source src="/sounds/music.mp3" type="audio/mpeg">
			</audio>
			<audio id="voice-sound">
				<source src="/sounds/voice.mp3" type="audio/mpeg">
			</audio>
			<audio id="eat-sound">
				<source src="/sounds/eat.mp3" type="audio/mpeg">
			</audio>
			<audio id="flush-sound">
				<source src="/sounds/flush.mp3" type="audio/mpeg">
			</audio>
			<audio id="death-sound">
				<source src="/sounds/death.mp3" type="audio/mpeg">
			</audio>

			<!-- Main amiwuevo visual content -->
			<div class="amiwuevo-name default-text">
				<p id="display-name">Cargando...</p>
			</div>
			<div class="main-content">
				<div class="main-content-left">
					<div class="amiwuevo-container">
  						<img src="/images/gifs/base_idle.gif" class="egg" alt="Egg">
					</div>
				</div>
				<!-- Background inputs, for background changing button -->
				<input type="file" id="bgFileInput" accept="image/png,image/jpeg,image/gif" style="display:none">
				<div class="game-buttons">
					<button class="trigger-eat-btn" onclick="eatSound()"><img src="/images/icons/bowl-food-solid.svg" alt="give food"></button>
					<button class="change-fit-btn" onclick="flushSound()"><img src="/images/icons/shirt-solid.svg" alt="change outfit"></button>
					<button class="change-bg-btn" onclick="flushSound()"><img src="/images/icons/image-solid.svg" alt="change decor"></button>
					<button class="kill-btn"><img src="/images/icons/skull-solid.svg" alt="kill amiwuevo"></button>
				</div>
			</div>
			<!-- Dialogue box -->
			<div class="dialogue-text default-text">
				<p id="dialogue">"Hola. Si cierras esta pestaña, moriré"</p>
			</div>
			<div class="dialogue-button">
					<button onclick= "readFile()"><img src="/images/icons/text.svg" alt="Talk to amiwevo"></button>
			</div>
		</div>
		<!-- Right side buttons for extra web usage -->
		<div class="right-content">
			<a href="/redirect"><img src="/images/icons/arrow-turn-up-solid.svg" alt="internal redirect"></a>
			<a href="/external"><img src="/images/icons/arrow-up-right-from-square-solid.svg" alt="external redirect"></a>
			<button class="trigger-405"><img src="/images/icons/405-solid.svg" alt="error pages"></button>
			<a href="/images"><img src="/images/icons/image-solid.svg" alt="images"></a>
		</div>
	</body>
</html>
