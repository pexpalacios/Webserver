<!DOCTYPE html>

<head>
	<title class="title">AMIWUEVO</title>
	<link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>

	<div class="main-div">

		<div class="title">
			<p id="display-name">Cargando...</p>

			<input type="text" id="nameInput" placeholder="Enter name" maxlength="30">
			<button onclick="saveName()">Guardar</button>

			<!-- Input oculto para subir background personalizado -->
			<input type="file" id="bgFileInput" accept="image/png,image/jpeg,image/gif" style="display:none">
		</div>

		<div class="content">
			<div class="content-left">
				<div class="tamagotchi-container">
					<div class="egg-base"></div>
					<img src="/images/egg_face.gif" class="egg-face" alt="Egg Face">
				</div>
			</div>

			<div class="button-div">

				<!-- Feed -->
				<button onclick="/cgi-bin/">
					<img src="/images/icons/bowl-food-solid.svg" alt="give food">
				</button>

				<!-- Clothes -->
				<button onclick="/cgi-bin/">
					<img src="/images/icons/shirt-solid.svg" alt="change outfit">
				</button>

				<!-- Background (subir o resetear) -->
				<button class="decor-bg-btn">
					<img src="/images/icons/image-solid.svg" alt="change background">
				</button>

				<!-- Kill -->
				<button onclick="/cgi-bin/">
					<img src="/images/icons/xmark-solid.svg" alt="kill amiwuevo">
				</button>

			</div>
		</div>

		<div class="status-bar"></div>

	</div>

</body>

<script>

// 20260307 LOAD INITIAL DATA
window.onload = function()
{
	// Load name
	fetch('/api/name')
	.then(response => {
		if (!response.ok) throw new Error();
		return response.text();
	})
	.then(name => {
		if (name)
			document.getElementById("display-name").textContent = name;
		else
			document.getElementById("display-name").textContent = "amiwuevo name";
	})
	.catch(() => {
		document.getElementById("display-name").textContent = "amiwuevo name";
	});

	loadBackground();
};


// 20260307 SAVE NAME
function saveName()
{
	const name = document.getElementById("nameInput").value;

	if (!name)
	{
		alert("Introduce un nombre");
		return;
	}

	fetch('/api/name', {
		method: 'POST',
		body: name
	})
	.then(response => {
		if (response.ok)
		{
			document.getElementById("display-name").textContent = name;
			alert("Nombre guardado");
		}
		else
			alert("Error al guardar");
	})
	.catch(() => alert("Error de red"));
}


// 20260311 CHANGE BACKGROUND (CUSTOM UPLOAD)
document.addEventListener('DOMContentLoaded', function()
{
	const btn = document.querySelector('.decor-bg-btn');
	const fileInput = document.getElementById("bgFileInput");
	const content = document.querySelector('.content');

	if (!btn || !fileInput || !content)
		return;

	loadBackground();

	btn.addEventListener("click", function()
	{
		fetch("/api/background")
		.then(r => r.text())
		.then(path => {

			// si es fondo por defecto → subir imagen
			if (path.includes("images/backgrounds/bg_01.png"))
			{
				fileInput.click();
			}
			// si hay imagen subida → borrar
			else
			{
				fetch("/api/background", { method: "DELETE" })
				.then(res => {

					if (!res.ok)
						return;

					loadBackground();
				});
			}
		});
	});

	fileInput.addEventListener("change", function()
	{
		const file = fileInput.files[0];
		if (!file)
			return;

		fetch("/api/background", {
			method: "POST",
			body: file
		})
		.then(res => {

			if (!res.ok)
			{
				alert("Imagen no válida");
				return;
			}

			loadBackground();
		});
	});
});

//20260311 CARGAR BACKGROUND (AL INICIO Y DESPUÉS DE SUBIR/ELIMINAR)
function loadBackground()
{
	const content = document.querySelector('.content');

	fetch("/api/background")
	.then(r => r.text())
	.then(bg => {

		if (!bg)
			return;

		content.style.backgroundImage = "url('" + bg + "?v=" + Date.now() + "')";
	});
}
</script>
</body>
</html>
