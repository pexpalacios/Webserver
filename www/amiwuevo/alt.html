<!DOCTYPE html>
	<head>
		<title class="title">AMIWUEVO</title>
		<link rel="stylesheet" type="text/css" href="styles.css">
		<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
		<meta charset="utf-8">
	</head>
	<body>
		<script src="alt.js"></script>
		<!-- Empty div to give margin -->
		<div class="left-content"></div>
		<!-- main content div -->
		<div class="center-content">
			<!-- Start up modal for name input -->
			<dialog class="modal" id="dialogNameInput">
				<h2>Otorgale una identidad a tu Amiwuevo</h2>
				<input type="text" id="nameInput" placeholder="Enter name" maxlength="30">
				<button onclick="saveName()">Guardar</button>
			</dialog>

			<!-- Main amiwuevo visual content -->
			<div class="amiwuevo-name default-text">
				<p id="display-name">Cargando...</p>
			</div>
			<div class="main-content">
				<div class="main-content-left">
					<div class="amiwuevo-container">
  						<img src="/images/gifs/dead.gif" class="egg" alt="Egg">
					</div>
				</div>
				<!-- Background inputs, for background changing button -->
				<input type="file" id="bgFileInput" accept="image/png,image/jpeg,image/gif" style="display:none">
				<div class="game-buttons">
					<button class="trigger-eat-btn"><img src="/images/icons/bowl-food-solid.svg" alt="give food"></button>
					<button class="change-fit-btn"><img src="/images/icons/shirt-solid.svg" alt="change outfit"></button>
					<button class="change-bg-btn"><img src="/images/icons/image-solid.svg" alt="change decor"></button>
					<button class="kill-btn"><img src="/images/icons/skull-solid.svg" alt="kill amiwuevo"></button>
				</div>
			</div>
			<!-- Dialogue box -->
			<div class="dialogue-text default-text">
				<p id="dialogue">"..."</p>
			</div>
			<div class="dialogue-button">
					<button><img src="/images/icons/text.svg" alt="Talk to amiwevo"></button>
			</div>
		</div>
		<!-- Right side buttons for extra web usage -->
		<div class="right-content">
			<a href="/redirect"><img src="/images/icons/arrow-turn-up-solid.svg" alt="internal redirect"></a>
			<a href="/external"><img src="/images/icons/arrow-up-right-from-square-solid.svg" alt="external redirect"></a>
			<button class="trigger-405"><img src="/images/icons/405-solid.svg" alt="error pages"></button>
			<a href="/images"><img src="/images/icons/image-solid.svg" alt="images"></a>
		</div>
	</body>
</html>
