
default error_page 404 ./error/404.html;
default error_page 405 ./error/405.html;

server {
	listen 8080 8081;
	host 127.0.0.1;
	server_name amiwuevo;
	error_page 403 ./www/amiwuevo/error/403.html;
	error_page 404 ./www/amiwuevo/error/404.html;
	error_page 405 ./www/amiwuevo/error/405.html;
	error_page 500 ./www/amiwuevo/error/500.html;
	root ./www/amiwuevo;
	index ./www/amiwuevo/index.html;
	client_max_body_size 100Mb;
	#Can define URL as URL /amiwuevo to redirect to /tmp/www
	#Can define a default page when the url requested is a directory, I think that's teh root

	#Location can have a storage location for files using POST in client side
	location / {
		allow_methods GET POST DELETE;
		autoindex on;
		index ./www/amiwuevo/index.html;
		upload ./www/amiwuevo/upload;
	}

	location /error {}

	#Enable and disable dirctory listing - this is the autoindex option
	location /images {
		root ./www/amiwuevo;
		autoindex on;
		}

	#Enable and disable dirctory listing - this is the autoindex option
	location /sounds {
		root ./www/amiwuevo;
		autoindex on;
		}

	#Need to read the cgi's stuff better
	location /cgi-bin {
		root ./www/amiwuevo;
		cgi_path /usr/bin/python3 /usr/bin/php /usr/bin/bash;
		cgi_ext .py .php .sh;
	}
}

server {
	listen 8080;
	host 127.0.0.1;
	server_name localhost;
	root ./www/localhost;
	index ./www/localhost/index.html;
	client_max_body_size 100Mb;
	location / {
		allow_methods GET POST DELETE;
	}
}

